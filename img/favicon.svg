<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1448"/>
      <stop offset="1" stop-color="#0a0719"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe49c"/>
      <stop offset="1" stop-color="#d79b33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a85"/>
      <stop offset="1" stop-color="#241968"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Месяц и звезда крупные и редкие: мелкая россыпь на 16 px
       превращается в грязь, поэтому деталей по минимуму. -->
  <path d="M17.5 9.5a8 8 0 100 15 9.8 9.8 0 010-15z" fill="url(#gold)"/>
  <path d="M48.5 11.5l1.9 4.6 4.6 1.9-4.6 1.9-1.9 4.6-1.9-4.6-4.6-1.9 4.6-1.9z" fill="url(#gold)"/>

  <!-- Веер из трёх карт. Обводка толстая: на 16 px силуэт держится
       именно на ней, тонкая линия там исчезает. -->
  <g stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round">
    <rect x="8.5" y="27" width="19" height="29" rx="3" fill="url(#card)"
          transform="rotate(-18 18 41.5)"/>
    <rect x="36.5" y="27" width="19" height="29" rx="3" fill="url(#card)"
          transform="rotate(18 46 41.5)"/>
    <rect x="21.4" y="24" width="21.2" height="32" rx="3.6" fill="url(#card)"/>
  </g>

  <!-- Солнце: диск крупный, лучи короткие и толстые -->
  <g fill="url(#gold)">
    <circle cx="32" cy="38" r="7"/>
    <path d="M32 25.6l2.2 5.1h-4.4zM32 50.4l2.2-5.1h-4.4z"/>
    <path d="M19.6 38l5.1-2.2v4.4zM44.4 38l-5.1-2.2v4.4z"/>
    <path d="M23.2 29.2l5.2 2.3-2.9 2.9zM40.8 46.8l-5.2-2.3 2.9-2.9z"/>
    <path d="M40.8 29.2l-2.3 5.2-2.9-2.9zM23.2 46.8l2.3-5.2 2.9 2.9z"/>
  </g>
</svg>
